<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Text Reader — Scroll & Page Modes</title>

<style>
/* ── Version badge ── */
#versionTag {
  display: inline-block;
  font-size: 11px;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-weight: 600;
  color: #666;
  background: #f0f0f0;
  border: 1px solid #ddd;
  border-radius: 4px;
  padding: 2px 7px;
  margin-left: 8px;
  letter-spacing: 0.5px;
  vertical-align: middle;
  user-select: all;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
#versionTag:hover {
  background: #e0e7ff;
  color: #2563eb;
  border-color: #2563eb;
}
#versionTag::before {
  content: "v";
  opacity: 0.6;
}
</style>

<!-- CSS: primary → fallback -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/math-examples/select-word@v1.0.3/css/app.css"
      integrity="sha384-A5lx0FMcEBNFnyY8TEVX796lG4MAkdHR5mSluxBS/dI3rye2LCC6uuRXyeN9FuGH"
      crossorigin="anonymous"
      onerror="this.onerror=null;this.href='https://gcore.jsdelivr.net/gh/math-examples/select-word@v1.0.3/css/app.css';">
</head>
<body>

<div id="logBar">
    <span id="logText">Long press any word or character</span>
    <span id="versionTag" title="Click to copy version"></span>
    <a id="dictLink" href="#" target="_blank" rel="noopener" hidden>📖 有道</a>
</div>

<div id="editor"></div>
<div id="loadingIndicator">Loading…</div>
<div id="pageIndicator"></div>

<div id="scrubber">
    <div id="scrubTrack">
        <div id="scrubFill"></div>
        <div id="scrubKnob"></div>
        <div id="scrubLabel">0%</div>
    </div>
</div>

<div class="controls">
    <label for="fileInput">📂 Load File</label>
    <input type="file" id="fileInput" accept=".txt,.text,.md">
    <button id="loadSample">Sample</button>
    <button id="modeToggle" class="mode-btn">📖 Page Mode</button>
</div>
<p class="hint" id="modeHint">Long press (600ms) to select a word · tap once to reveal scrubber · drag to jump</p>

<!-- JS modules: primary → gcore → fastly, with SRI -->
<script>
(function() {
  var version = 'v1.0.3';
  var base = '/gh/math-examples/select-word@' + version + '/js/';
  var files = ['state.js', 'ui.js', 'scroll.js'];

  // ── Display version in the badge ──
  var tag = document.getElementById('versionTag');
  if (tag) {
    tag.textContent = version.replace(/^v/, '');
    tag.addEventListener('click', function() {
      navigator.clipboard.writeText(version).then(function() {
        var old = tag.textContent;
        tag.textContent = 'copied!';
        setTimeout(function() { tag.textContent = old; }, 1000);
      }).catch(function() {
        // Fallback: select text
        var range = document.createRange();
        range.selectNode(tag);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      });
    });
  }

  var sriHashes = {
    'state.js': 'sha384-8/jidUaqmf7f6GRN4cQf1q3p8Yi9AxehXvLjARJKVt+6EmE/ngqN8PtPIXOGHk1s',
    'ui.js':    'sha384-8/uOhsLbJ1EsrpLqNJz0L9DRmaqsyhR5Ev83MeZefCkHa76xbeXesDxXhBoaUMD8',
    'scroll.js':'sha384-jyvdQQKZgEbA0EAeMbkskXQMJpb9D7Tzyz3phWZlERrbNs/GUckfsDYfrSukhxEy'
  };

  var cdns = [
    'https://cdn.jsdelivr.net',
    'https://gcore.jsdelivr.net',
    'https://fastly.jsdelivr.net'
  ];

  function loadScript(filename, retries) {
    retries = retries || 0;
    if (retries >= cdns.length) {
      console.error('All CDNs failed for', filename);
      document.getElementById('loadingIndicator').textContent = 'Failed to load ' + filename;
      document.getElementById('loadingIndicator').style.display = 'block';
      return;
    }

    var script = document.createElement('script');
    script.src = cdns[retries] + base + filename;
    if (sriHashes[filename] && sriHashes[filename].indexOf('__') !== 0) {
      script.integrity = sriHashes[filename];
      script.crossOrigin = 'anonymous';
    }

    script.onload = function() {
      loaded++;
      if (loaded === files.length) {
        console.log('✓ All modules loaded');
      }
    };

    script.onerror = function() {
      loadScript(filename, retries + 1);
    };

    document.head.appendChild(script);
  }

  var loaded = 0;
  files.forEach(function(f) { loadScript(f); });
})();
</script>

</body>
</html>
