<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Text Reader — Scroll & Page Modes</title>

<!-- App config: version + SRI hashes (easy to update, visible in HTML) -->
<script>
window.__APP_CONFIG__ = {
  version: 'v1.0.7',
  base: '/gh/math-examples/select-word@',
  files: ['state.js', 'ui.js', 'scroll.js'],
  sriHashes: {
    'state.js': 'sha384-8/jidUaqmf7f6GRN4cQf1q3p8Yi9AxehXvLjARJKVt+6EmE/ngqN8PtPIXOGHk1s',
    'ui.js':    'sha384-8/uOhsLbJ1EsrpLqNJz0L9DRmaqsyhR5Ev83MeZefCkHa76xbeXesDxXhBoaUMD8',
    'scroll.js':'sha384-jyvdQQKZgEbA0EAeMbkskXQMJpb9D7Tzyz3phWZlERrbNs/GUckfsDYfrSukhxEy'
  },
  cdns: [
    'https://cdn.jsdelivr.net',
    'https://gcore.jsdelivr.net',
    'https://fastly.jsdelivr.net'
  ]
};
</script>

<!-- CSS: primary → fallback -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/math-examples/select-word@v1.0.7/css/app.css"
      integrity="sha384-A5lx0FMcEBNFnyY8TEVX796lG4MAkdHR5mSluxBS/dI3ry2LCC6uuRXyeN9FuGH"
      crossorigin="anonymous"
      onerror="this.onerror=null;this.href='https://gcore.jsdelivr.net/gh/math-examples/select-word@v1.0.7/css/app.css';">
</head>
<body>

<div id="logBar">
    <span id="logText">Long press any word or character</span>
    <span id="versionTag" title="Click to copy version"></span>
    <a id="dictLink" href="#" target="_blank" rel="noopener" hidden>📖 有道</a>
</div>

<div id="editor"></div>
<div id="loadingIndicator">Loading…</div>
<div id="pageIndicator"></div>

<div id="scrubber">
    <div id="scrubTrack">
        <div id="scrubFill"></div>
        <div id="scrubKnob"></div>
        <div id="scrubLabel">0%</div>
    </div>
</div>

<div class="controls">
    <label for="fileInput">📂 Load File</label>
    <input type="file" id="fileInput" accept=".txt,.text,.md">
    <button id="loadSample">Sample</button>
    <button id="modeToggle" class="mode-btn">📖 Page Mode</button>
</div>
<p class="hint" id="modeHint">Long press (600ms) to select a word · tap once to reveal scrubber · drag to jump</p>

<!-- Loader: reads window.__APP_CONFIG__ -->
<script src="https://cdn.jsdelivr.net/gh/math-examples/select-word@v1.0.7/js/loader.js"
        integrity="sha384-8/uOhsLbJ1EsrpLqNJz0L9DRmaqsyhR5Ev83MeZefCkHa76xbeXesDxXhBoaUMD8"
        crossorigin="anonymous"
        onerror="this.onerror=null;this.src='https://gcore.jsdelivr.net/gh/math-examples/select-word@v1.0.7/js/loader.js';"></script>

</body>
</html>
